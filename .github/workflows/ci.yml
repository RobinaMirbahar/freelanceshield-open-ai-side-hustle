name: Node.js & Architecture Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Application Source & Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON Manifests, Scripts & Documentation
        run: |
          python3 - << 'EOF'
          import pathlib, json

          root = pathlib.Path(".")
          for j in root.rglob("*.json"):
              if "node_modules" in j.parts or ".git" in j.parts:
                  continue
              try:
                  json.loads(j.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"Skipping non-strict JSON {j}: {e}")

          readme = root / "README.md"
          assert readme.exists() and readme.stat().st_size > 100, "README.md must exist and be non-empty"
          print("Repository manifests and README architecture verified.")
          EOF
